<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Site Maths AABIL</title>
    <link rel="icon" href="logopi.png" type="image/png">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f4f9;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: #2c3e50;
            color: #fff;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 20px;
        }

        .logo-container {
            margin-bottom: 10px;
            text-align: center;
        }

        .logo {
            font-size: 1.4rem;
            color: #fff;
        }

        .logo span {
            color: #1abc9c;
        }

        /* Navigation centrée à deux liens */
        .nav-links > ul {
            display: flex;
            justify-content: center;
            align-items: center;
            list-style: none;
            gap: 15px;
        }

        .nav-link > a {
            display: flex;
            align-items: center;
            padding: 10px 20px;
            color: #fff;
            text-decoration: none;
            font-weight: bold;
            transition: background 0.3s;
            border-radius: 4px;
            background-color: #34495e;
        }

        .nav-link > a:hover {
            background-color: #1abc9c;
        }

        /* Conteneur principal */
        .main-content {
            flex: 1;
            width: 100%;
            padding: 10px;
        }

        iframe {
            border: none;
            border-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        /* Pied de page */
        footer {
            background-color: #2c3e50;
            color: #fff;
            text-align: center;
            padding: 15px;
            margin-top: auto;
        }

        footer a {
            color: #1abc9c;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .nav-links > ul {
                flex-direction: row;
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="container">
            <div class="logo-container">
                <h3 class="logo">Sujets <span>Du Bac</span></h3>
            </div>

            <div class="nav-btn">
                <div class="nav-links">
                    <ul>
                        <li class="nav-link">
                            <a href="index.html">Énoncés</a>
                        </li>
                        <li class="nav-link">
                            <a href="index1.html">Corrigés</a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </header>

    <main class="main-content">
        <iframe src="SC_EXC/SX2011N-COR.pdf" width="100%" height="800px"></iframe>
    </main>

    <footer id="footer">
        <p>© 2023 AABIL Aissa - <a href="mailto:aissa.aabil@gmail.com">aissa.aabil@gmail.com</a></p>
    </footer>
</body>

</html>
